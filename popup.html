<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        font:
          13px system-ui,
          sans-serif;
      }
      textarea {
        width: 100%;
        height: 120px;
        box-sizing: border-box;
        font-family: monospace;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      button {
        flex: 1;
        padding: 6px;
        cursor: pointer;
      }
      #status {
        margin-top: 8px;
        color: #666;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <textarea id="text" placeholder="Paste text here (Ctrl+V)"></textarea>
    <div class="row">
      <button id="read">Read clipboard</button>
      <button id="go">Type in 3s</button>
    </div>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
